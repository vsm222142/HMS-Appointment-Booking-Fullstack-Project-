services:
  - type: web
    name: hms-backend
    env: docker
    dockerContext: ./hms-backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: hms-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: hms-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: hms-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*" # We can restrict this later once we have the Vercel URL
      - key: JAVA_OPTS
        value: "-Xmx512m"

databases:
  - name: hms-db
    databaseName: hms_db
    user: hms_user
    plan: free
    region: singapore
